name: Build Snake 26S APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Snake26S-Android-GitHub.zip -d snake-project

      - name: Find project directory
        run: |
          echo "Project contents:"
          find snake-project -maxdepth 3 -type f | head -100

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: snake-project/package-lock.json

      - name: Install dependencies
        working-directory: snake-project
        run: npm install

      - name: Build web app
        working-directory: snake-project
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        working-directory: snake-project
        run: npx cap sync android

      - name: Build APK
        working-directory: snake-project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-26S-debug-apk
          path: snake-project/android/app/build/outputs/apk/debug/app-debug.apk
